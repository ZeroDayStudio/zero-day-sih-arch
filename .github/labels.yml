- name: 'status/LGTM'
  color: '0E8A16'
  description: 'Looks good to me; approved for merge.'
- name: 'status/checked'
  color: '0E8A16'
  description: 'Code has been tested and verified locally.'
- name: 'status/needs-review'
  color: 'FBCA04'
  description: 'Ready for code review.'
- name: 'status/in-progress'
  color: 'D93F0B'
  description: 'Work is currently ongoing; do not merge.'
- name: 'status/blocked'
  color: 'B60205'
  description: 'Blocked by external dependency or upstream issue.'
- name: 'status/wontfix'
  color: 'CFD3D7'
  description: 'Working as intended or out of scope.'

- name: 'type/feature'
  color: '8250DF'
  description: 'New feature implementation.'
- name: 'type/enhancement'
  color: 'C699FF'
  description: 'Iterative improvement on an existing capability.'
- name: 'type/bug'
  color: 'D73A4A'
  description: 'Defect or broken functionality.'
- name: 'type/refactor'
  color: '006B75'
  description: 'Internal restructuring without functional changes.'
- name: 'type/docs'
  color: '1D76DB'
  description: 'Documentation additions or updates.'
- name: 'type/testing'
  color: '1D76DB'
  description: 'Unit, integration, or E2E test coverage.'

- name: 'priority/P0-critical'
  color: 'B60205'
  description: 'System breaking defect requiring immediate resolution.'
- name: 'priority/P1-high'
  color: 'D73A4A'
  description: 'High priority deliverable for the current milestone.'
- name: 'priority/P2-medium'
  color: 'FBCA04'
  description: 'Standard priority task.'
- name: 'priority/P3-low'
  color: 'CFD3D7'
  description: 'Nice-to-have or low-impact task.'
